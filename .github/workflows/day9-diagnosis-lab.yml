name: Day 9 - Failure Diagnosis Lab

on:
  push:
    branches:
      - day9-reports-lab

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-day9.txt

      - name: Run automated tests
        run: |
          python -m pytest -q tests/test_day9_reservation.py \
            --junitxml=junit.xml \
            --cov=day9_reservation \
            --cov-branch \
            --cov-report=xml:coverage.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day9-test-evidence
          path: |
            junit.xml
            coverage.xml
          retention-days: 7
          if-no-files-found: error
