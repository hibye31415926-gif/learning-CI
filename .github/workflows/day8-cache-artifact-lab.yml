name: Day 8 - Cache and Artifacts

on:
  push:
    branches:
      - day8-cache-artifact-lab

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-day8.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-day8.txt

      - name: Run pytest
        run: |
          python -m pytest -q tests/test_day8_seat.py --junitxml=junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day8-pytest-report
          path: junit.xml
          retention-days: 7
          if-no-files-found: error

  review_report:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Download test report
        uses: actions/download-artifact@v5
        with:
          name: day8-pytest-report

      - name: Verify downloaded report
        run: test -s junit.xml
