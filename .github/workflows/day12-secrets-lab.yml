name: Day 12 - Secrets Security Lab

on:
  workflow_dispatch:

# No repository API permissions are needed.
permissions: {}

jobs:
  ordinary_ci:
    name: Ordinary CI - No Environment Secret
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify environment secret is unavailable
        shell: bash
        env:
          LAB_TOKEN: ${{ secrets.DAY12_LAB_TOKEN }}
        run: |
          if [[ -n "$LAB_TOKEN" ]]; then
            echo "::error::Unexpected access to lab secret"
            exit 1
          fi

          echo "PASS: environment secret unavailable"

  staging_lab:
    name: Staging - Scoped Secret Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: day12-lab-staging

    steps:
      - name: Check non-secret configuration
        shell: bash
        env:
          API_URL: ${{ vars.DAY12_LAB_API_URL }}
        run: |
          if [[ -z "$API_URL" ]]; then
            echo "::error::Missing API URL variable"
            exit 1
          fi

          if [[ -n "${DAY12_LAB_TOKEN:-}" ]]; then
            echo "::error::Unexpected step environment variable"
            exit 1
          fi

          echo "Configured test URL: $API_URL"
          echo "PASS: no token injected into this step"

      - name: Verify lab secret without printing it
        shell: bash
        env:
          DAY12_LAB_TOKEN: ${{ secrets.DAY12_INTENTIONALLY_MISSING }}
        run: |
          if [[ -z "$DAY12_LAB_TOKEN" ]]; then
            echo "::error::Required lab secret is missing"
            exit 1
          fi

          echo "PASS: lab secret is available"
          echo "Secret value was not displayed"

      - name: Record run identity
        shell: bash
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Run ID: $GITHUB_RUN_ID"
