name: Day 6 - Multi-Job DAG Lab

on:
  push:
    branches:
      - day6-dag-lab

permissions:
  contents: read

jobs:

  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pytest
        run: python -m pip install pytest

      - name: Execute tests
        run: python -m pytest -q

  syntax_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python -m compileall -q tests

  package_gate:
    needs: [unit_tests, syntax_check]
    runs-on: ubuntu-latest
    steps:
      - name: Package gate
        run: echo "Quality checks passed - packaging placeholder"

  diagnostics:
    needs: [unit_tests, syntax_check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Print dependency results
        env:
          TEST_RESULT: ${{ needs.unit_tests.result }}
          SYNTAX_RESULT: ${{ needs.syntax_check.result }}
        run: |
          echo "unit_tests=$TEST_RESULT"
          echo "syntax_check=$SYNTAX_RESULT"
