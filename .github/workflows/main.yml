name: CI Day 1 Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Runner
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Trigger Event: $GITHUB_EVENT_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "GitHub Ref: $GITHUB_REF"
          echo "Run SHA: $GITHUB_SHA"

      - name: Confirm Execution
        run: |
            echo "CI Day 1 workflow executed successfully"
