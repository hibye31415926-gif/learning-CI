name: CI Day 1 Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Runner
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Trigger Event: $GITHUB_EVENT_NAME"

      - name: Simulate Failure
      run: |
        echo "Simulating a CI failure"
        exit 1
