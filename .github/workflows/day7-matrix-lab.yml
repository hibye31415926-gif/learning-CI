name: Day 7 - Matrix Lab

on:
  push:
    branches:
      - day7-matrix-lab

permissions:
  contents: read

jobs:
  compatibility_test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Show environment
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.system())"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run automated tests
        run: python -m pytest -q

      - name: Intentional Windows failure
        if: ${{ matrix.os == 'windows-latest' }}
        run: exit 1
