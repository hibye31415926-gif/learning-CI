name: Day 4 Event Control Lab

on:
  push:
    branches:
      - 'ci/day4-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  LAB_COMPONENT: seat-reservation

jobs:
  inspect-event:
    runs-on: ubuntu-latest

    steps:
      - name: Identify Lab
        run: echo "Component=$LAB_COMPONENT"

      - name: Show Event Contexts
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event SHA: ${{ github.sha }}"
          echo "PR Head SHA: ${{ github.event.pull_request.head.sha }}"

      - name: Push-only Step
        if: ${{ github.event_name == 'push' }}
        run: echo "This step runs only for push events"

      - name: PR-only Step
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "This step runs only for pull_request events"
